<div class="max-w-5xl mx-auto px-4 pb-16 fade-in pt-8">
    <!-- Animated Premium Light-Theme Background (Fixed behind the content) -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1]" aria-hidden="true">
        <!-- Soft Blurry Pastel Blobs -->
        <div
            class="absolute top-[10%] left-[-15%] w-[35rem] h-[35rem] rounded-full bg-indigo-200/20 blur-[120px] animate-blob-float-1">
        </div>
        <div
            class="absolute top-[45%] right-[-15%] w-[42rem] h-[42rem] rounded-full bg-sky-200/15 blur-[140px] animate-blob-float-2">
        </div>
        <div
            class="absolute bottom-[15%] left-[-5%] w-[38rem] h-[38rem] rounded-full bg-blue-200/20 blur-[130px] animate-blob-float-3">
        </div>
        <div
            class="absolute bottom-[-10%] right-[10%] w-[30rem] h-[30rem] rounded-full bg-rose-200/15 blur-[100px] animate-blob-float-1">
        </div>

        <!-- Elegant Flowing Light SVG Curves -->
        <svg class="absolute inset-0 w-full h-full opacity-60" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="qr-curve-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
                    <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="#ec4899" stop-opacity="0.15" />
                </linearGradient>
                <linearGradient id="qr-curve-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.12" />
                    <stop offset="50%" stop-color="#eab308" stop-opacity="0.12" />
                    <stop offset="100%" stop-color="#6366f1" stop-opacity="0.12" />
                </linearGradient>
            </defs>
            <path d="M -100 200 C 300 100, 100 800, 700 650 C 1300 500, 900 1200, 1500 1000" fill="none"
                stroke="url(#qr-curve-grad-1)" stroke-width="1.5" stroke-dasharray="15 20" class="animate-svg-flow-1" />
            <path d="M 100 1800 C 500 1500, 300 2300, 900 2000 C 1500 1700, 1100 2600, 1700 2400" fill="none"
                stroke="url(#qr-curve-grad-2)" stroke-width="1.5" stroke-dasharray="12 16" class="animate-svg-flow-2" />
        </svg>
    </div>

    <style>
        /* Light-theme background floating animation blobs */
        @keyframes blob-float-1 {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(40px, -60px) scale(1.05);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.95);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        @keyframes blob-float-2 {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            50% {
                transform: translate(-50px, 50px) scale(0.92);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        @keyframes blob-float-3 {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(50px, 30px) scale(0.96);
            }

            66% {
                transform: translate(-40px, -50px) scale(1.03);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob-float-1 {
            animation: blob-float-1 30s infinite ease-in-out;
        }

        .animate-blob-float-2 {
            animation: blob-float-2 35s infinite ease-in-out;
        }

        .animate-blob-float-3 {
            animation: blob-float-3 32s infinite ease-in-out;
        }

        /* SVG flow animations */
        @keyframes svg-flow-1 {
            to {
                stroke-dashoffset: -1000;
            }
        }

        @keyframes svg-flow-2 {
            to {
                stroke-dashoffset: 1000;
            }
        }

        .animate-svg-flow-1 {
            animation: svg-flow-1 80s linear infinite;
        }

        .animate-svg-flow-2 {
            animation: svg-flow-2 100s linear infinite;
        }

        /* Form elements & buttons */
        .color-dot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
            border-color: #6366f1 !important;
        }

        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        /* Switch toggle button styling */
        .toggle-checkbox:checked+.toggle-label {
            background-color: #3b82f6;
        }

        .toggle-checkbox:checked+.toggle-label .toggle-dot {
            transform: translateX(100%);
        }

        /* Toast notification styling */
        .toast-popup {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translate(-50%, 100px);
            opacity: 0;
            visibility: hidden;
        }

        .toast-popup.show {
            transform: translate(-50%, 0);
            opacity: 1;
            visibility: visible;
        }
    </style>

    <!-- Header Banner -->
    <div class="bg-white rounded-3xl p-6 md:p-10 shadow-xl border-t-8 border-indigo-600 relative overflow-hidden mb-10">
        <div class="absolute top-0 right-0 p-8 opacity-10">
            <i class="fa-solid fa-qrcode text-8xl text-indigo-600"></i>
        </div>

        <h2 class="text-3xl md:text-4xl font-bold text-slate-800 mb-3 relative z-10 flex items-center gap-3">
            <i class="fa-solid fa-qrcode text-indigo-600"></i> ระบบสร้างรหัสคิวอาร์ (QR Code Generator)
        </h2>
        <p class="text-slate-600 text-lg relative z-10">สร้างคิวอาร์โค้ดสำหรับลิงก์หรือข้อความที่ต้องการ</p>
    </div>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Left Column: Controls (7 cols) -->
        <div class="lg:col-span-7 bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-100 space-y-6">
            <h3 class="text-xl font-bold text-slate-800 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-600"></i> ตั้งค่าข้อมูลคิวอาร์โค้ด
            </h3>

            <!-- Input: Text / URL -->
            <div class="space-y-2">
                <label for="qr-input" class="block text-sm font-bold text-slate-700">ลิงก์ / ข้อความ (Link or Text)
                    <span class="text-rose-500">*</span></label>
                <div class="relative rounded-xl shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-link text-slate-400"></i>
                    </div>
                    <input type="text" id="qr-input"
                        class="block w-full pl-11 pr-4 py-3.5 sm:text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-800 transition-all font-mono"
                        placeholder="https://www.bb.go.th" value="https://www.bb.go.th">
                </div>
            </div>

            <!-- Size Selection -->
            <div class="space-y-2">
                <label for="qr-size" class="block text-sm font-bold text-slate-700 font-sans">ขนาดของรูปภาพ (QR Code
                    Size)</label>
                <div class="relative">
                    <select id="qr-size"
                        class="block w-full px-4 py-3 sm:text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-700 cursor-pointer transition-all">
                        <option value="250">ขนาดเล็ก (250 x 250 px)</option>
                        <option value="350" selected>ขนาดมาตรฐาน (350 x 350 px)</option>
                        <option value="450">ขนาดใหญ่ (450 x 450 px)</option>
                    </select>
                </div>
            </div>

            <!-- Color Options -->
            <div class="space-y-3">
                <label class="block text-sm font-bold text-slate-700">โทนสีหลักของรหัส (QR Code Color)</label>
                <div class="flex flex-wrap gap-4 items-center">
                    <!-- Preset Colors -->
                    <button
                        class="color-dot w-9 h-9 rounded-full bg-[#0a192f] border-2 border-slate-200 active flex items-center justify-center cursor-pointer"
                        data-color="#0a192f" title="Navy Blue"></button>
                    <button
                        class="color-dot w-9 h-9 rounded-full bg-[#1e3a8a] border-2 border-slate-200 flex items-center justify-center cursor-pointer"
                        data-color="#1e3a8a" title="Indigo Blue"></button>
                    <button
                        class="color-dot w-9 h-9 rounded-full bg-[#0f766e] border-2 border-slate-200 flex items-center justify-center cursor-pointer"
                        data-color="#0f766e" title="Teal Green"></button>
                    <button
                        class="color-dot w-9 h-9 rounded-full bg-[#000000] border-2 border-slate-200 flex items-center justify-center cursor-pointer"
                        data-color="#000000" title="Black"></button>

                    <!-- Custom Color Picker -->
                    <div class="h-px w-6 bg-slate-200"></div>
                    <div class="flex items-center gap-2">
                        <div
                            class="relative w-9 h-9 rounded-full border border-slate-200 overflow-hidden cursor-pointer">
                            <input type="color" id="qr-color"
                                class="absolute inset-0 w-full h-full p-0 border-0 cursor-pointer scale-[1.5]"
                                value="#0a192f">
                        </div>
                        <span class="text-xs font-bold text-slate-500">เลือกสีอื่นด้วยตัวเอง</span>
                    </div>
                </div>
            </div>

            <!-- Logo Toggle Switch -->
            <div class="flex flex-col gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100 transition-all">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div
                            class="bg-indigo-50 text-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-inner">
                            <i class="fa-solid fa-shield-halved text-base"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-slate-800">ประทับตราตรงกลาง (Center Logo)</h4>
                            <p class="text-xs text-slate-500">ใส่โลโก้ที่จุดกึ่งกลางคิวอาร์โค้ด</p>
                        </div>
                    </div>
                    <!-- Toggle -->
                    <div class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="qr-logo-toggle" class="sr-only toggle-checkbox" checked>
                        <label for="qr-logo-toggle"
                            class="w-11 h-6 bg-slate-200 rounded-full block relative transition-colors duration-200 cursor-pointer toggle-label">
                            <span
                                class="toggle-dot w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 shadow-sm transition-transform duration-200"></span>
                        </label>
                    </div>
                </div>

                <!-- Logo Selection Options -->
                <div id="qr-logo-options" class="flex flex-col gap-2 mt-2 ml-14">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="qr-logo-type" value="bureau" class="w-4 h-4 text-indigo-600 bg-white border-slate-300 focus:ring-indigo-500" checked>
                        <span class="text-sm text-slate-700">สำนักงบประมาณ</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="qr-logo-type" value="drr_color" class="w-4 h-4 text-indigo-600 bg-white border-slate-300 focus:ring-indigo-500">
                        <span class="text-sm text-slate-700">กรมทางหลวงชนบท (สี)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="qr-logo-type" value="drr_bw" class="w-4 h-4 text-indigo-600 bg-white border-slate-300 focus:ring-indigo-500">
                        <span class="text-sm text-slate-700">กรมทางหลวงชนบท (ขาวดำ)</span>
                    </label>
                </div>
            </div>


        </div>

        <!-- Right Column: Live Preview & Actions (5 cols) -->
        <div class="lg:col-span-5 flex flex-col gap-6">

            <!-- Preview Panel -->
            <div
                class="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-slate-100 flex flex-col items-center justify-center">
                <h3 class="text-lg font-bold text-slate-800 border-b pb-3 w-full text-center mb-6">
                    <i class="fa-solid fa-display text-indigo-600 mr-1"></i> ตัวอย่างรหัสคิวอาร์
                </h3>

                <!-- Canvas Wrapper -->
                <div
                    class="relative bg-slate-50 border border-slate-200 rounded-2xl p-6 shadow-inner flex items-center justify-center group overflow-hidden w-full max-w-[320px] aspect-square">
                    <!-- We render to a hidden canvas, then scale it onto a preview canvas to make it responsive & sharp -->
                    <canvas id="qr-canvas-preview"
                        class="max-w-full max-h-full object-contain drop-shadow-[0_4px_12px_rgba(0,0,0,0.06)]"></canvas>
                    <!-- Hidden raw canvas for full-resolution rendering/download -->
                    <canvas id="qr-canvas-raw" class="hidden"></canvas>
                </div>

                <!-- Live Info Label -->
                <div class="mt-4 text-center">
                    <span
                        class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-bold rounded-full border border-emerald-200">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                        พร้อมสแกน / พร้อมใช้งาน
                    </span>
                </div>
            </div>

            <!-- Action Buttons Card -->
            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-4">

                <!-- Action: Download -->
                <button id="qr-download-btn"
                    class="action-btn w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/15 flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer focus:outline-none focus:ring-4 focus:ring-indigo-600/30">
                    <i class="fa-solid fa-download"></i> ดาวน์โหลดรูปภาพ (PNG)
                </button>

                <!-- Action: Copy to Clipboard -->
                <button id="qr-copy-btn"
                    class="action-btn w-full bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold py-3.5 px-6 rounded-2xl shadow-sm flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer focus:outline-none focus:ring-4 focus:ring-slate-100">
                    <i class="fa-solid fa-copy"></i> คัดลอกไปยังคลิปบอร์ด
                </button>

            </div>

        </div>

    </div>

    <!-- System Toast Popup Notification -->
    <div id="qr-toast"
        class="toast-popup fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] bg-slate-900/95 backdrop-blur-md text-white px-6 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10 max-w-sm w-max">
        <div class="bg-emerald-500 text-slate-950 w-7 h-7 rounded-full flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-check text-sm font-black"></i>
        </div>
        <span id="qr-toast-msg" class="text-sm font-semibold">บันทึกสำเร็จ</span>
    </div>

    <!-- Back to Main Button -->
    <div class="text-center mt-12 pb-4">
        <button onclick="showLanding(document.getElementById('nav-home'))"
            class="inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all transform hover:scale-105 cursor-pointer">
            <i class="fa-solid fa-arrow-left"></i> กลับสู่หน้าหลัก
        </button>
    </div>
</div>
